[project]
name = "farfuntool"
version = "0.6.26"
description = "farfarfun 的 Python 工具集，提供下载、爬虫、路径、时间和数据库辅助 API。"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "牛哥", email = "farfarfun@qq.com" },
]
dependencies = [
    "beautifulsoup4>=4.12",
    "farlog>=1.1.7",
    "feedparser>=6.0",
    "funget>=1.1.69",
    "funsecret>=1.4.84",
    "ipython>=8.0",
    "ipywidgets>=8.0",
    "lxml>=5.0",
    "numpy>=2.0; python_version >= '3.13'",
    "numpy>=1.24; python_version < '3.13'",
    "pandas>=2.0",
    "pycryptodome>=3.19",
    "psutil>=5.9",
    "requests>=2.31",
    "six>=1.16",
    "tqdm>=4.66",
]

[project.optional-dependencies]
everything = ["matplotlib>=3.7", "mxnet>=1.9; python_version < '3.13'"]
download = ["pycurl>=7.45", "rarfile>=4.1"]

[dependency-groups]
dev = ["pytest>=8.0.0", "ruff>=0.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/funtool"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff.lint]
# farlog（loguru）的 `{}` 占位符 + 位置参数调用会被 ruff 误判成 stdlib logging 的
# `%s` 语法并报 PLE1205（参数过多），沿用组织既有做法（#695）忽略该规则。
ignore = ["PLE1205"]
